[workspace]
members = [
  "packages/core",
  "packages/conformance",
  "packages/tx",
  "packages/server",
  "packages/client",
  "packages/issuer",
  "packages/fake-index",
  # "packages/index",
  # "packages/cli",
  ######### EXAMPLE ############
  "examples/echo/server",
  "examples/echo/proxy",
  "examples/echo/client",

]
resolver = "2"

[workspace.package]
description = "Subbit stack in rust"
documentation = "https://github.com/kompact-io/subbit-rs"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/kompact-io/subbit-rs"
homepage = "https://github.com/kompact-io/subbit-rs"
license = "MPL-2.0"
authors = ["@waalge"]
rust-version = "1.97.1"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"

[workspace.dependencies]
amaru-uplc = "0.3.0"
anyhow = "1.0.102"
async-trait = "0.1.92"
axum = { version = "0.8.9" }
base64 = "0.22.1"
blake3 = "1.8.6"
cardano-connector = { git = "https://github.com/cardano-lightning/konduit", branch = "main" }
cardano-connector-direct = { git = "https://github.com/cardano-lightning/konduit", branch = "main" }
cardano-sdk = { git = "https://github.com/cardano-lightning/konduit.git", branch = "main" }
clap = { version = "4.6.1", features = ["env", "derive"] }
cryptoxide = "0.5.1"
dotenvy = "0.15.7"
hex = { version = "0.4", default-features = false }
matchit = "0.9.2"
minicbor = { version = "2.2.2", default-features = false }
minicbor_old = { package = "minicbor", version = "0.25" }
postcard = { version = "1.1.3", features = ["alloc"] }
proptest = "1"
proptest-derive = "0.8.0"
rand="0.10.2"
redb = "4.1"
reqwest = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = "3.21.0"
thiserror = { version = "2.0.17", default-features = false }
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
web-time = "1.1.0"
wasm-bindgen = "0.2.127"
js-sys = "0.3.104"
ed25519-dalek = { version = "3.0.0", default-features = false }

subbit-core = { path = "packages/core", default-features = false }
subbit-tx = { path = "packages/tx", default-features = false }
subbit-server = { path = "packages/server", default-features = false }
subbit-client = { path = "packages/client", default-features = false }
subbit-issuer = { path = "packages/issuer", default-features = false }
subbit-fake-index = { path = "packages/fake-index", default-features = false }
subbit-examples-echo-server = { path = "examples/echo/server" }
subbit-examples-echo-proxy = { path = "examples/echo/proxy", default-features = false }
subbit-examples-echo-client = { path = "examples/echo/client" }
